<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CISSP GRIND — cloudnomad.us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050510;
  --surface: rgba(10,15,30,0.85);
  --surface2: rgba(15,25,50,0.7);
  --cyan: #00d4ff;
  --cyan-dim: #0099bb;
  --cyan-glow: rgba(0,212,255,0.25);
  --orange: #ff6a00;
  --orange-glow: rgba(255,106,0,0.25);
  --white: #e0f0ff;
  --white2: #8899bb;
  --white3: #445577;
  --red: #ff2244;
  --green: #00ff88;
  --border: rgba(0,212,255,0.12);
  --border-bright: rgba(0,212,255,0.35);
  --glow: 0 0 15px var(--cyan-glow), 0 0 30px rgba(0,212,255,0.08);
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--white);font-family:var(--font-body);font-weight:400;min-height:100vh;overflow-x:hidden;}
::selection{background:var(--cyan);color:var(--bg);}

/* === CANVAS BG === */
#tron-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* === TOPBAR === */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--surface);
  backdrop-filter:blur(30px);
  border-bottom:1px solid var(--border);
  padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  font-family:var(--font-display);font-size:0.85rem;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;
  color:var(--cyan);
  text-shadow:0 0 10px var(--cyan-glow),0 0 30px rgba(0,212,255,0.15);
}
.logo span{color:var(--white3);font-weight:400;letter-spacing:1px;font-size:0.65rem;}
.stats{display:flex;gap:18px;align-items:center;}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:0.75rem;color:var(--white3);}
.stat-v{color:var(--cyan);font-weight:700;}
.stat-orange{color:var(--orange);}
.lvl{
  font-family:var(--font-display);font-size:0.6rem;font-weight:700;
  letter-spacing:2px;padding:3px 10px;
  border:1px solid var(--cyan);color:var(--cyan);
  text-shadow:0 0 8px var(--cyan-glow);
  box-shadow:0 0 8px rgba(0,212,255,0.15);
}
.xp-outer{width:70px;height:3px;background:rgba(0,212,255,0.1);overflow:hidden;}
.xp-inner{height:100%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);transition:width 0.6s ease;}

/* === NAV === */
.nav{
  background:var(--surface);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;padding:0 24px;
}
.nav button{
  background:none;border:none;
  font-family:var(--font-display);font-size:0.6rem;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--white3);padding:12px 18px;
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all 0.3s;white-space:nowrap;
}
.nav button:hover{color:var(--white2);}
.nav button.active{
  color:var(--cyan);border-bottom-color:var(--cyan);
  text-shadow:0 0 10px var(--cyan-glow);
}

/* === MAIN === */
.main{max-width:1050px;margin:0 auto;padding:24px;position:relative;z-index:1;}

/* === CARD === */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:2px;padding:24px;margin-bottom:14px;
  backdrop-filter:blur(15px);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:0.4;
}
.card::after{
  content:'';position:absolute;top:0;left:0;width:1px;height:100%;
  background:linear-gradient(180deg,var(--cyan),transparent);
  opacity:0.2;
}
.card h2{font-family:var(--font-display);font-size:0.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:12px;text-shadow:0 0 8px var(--cyan-glow);}
.card h3{font-family:var(--font-display);font-size:0.65rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--white2);margin-bottom:8px;}

/* === DOMAIN GRID === */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.dcard{
  background:var(--surface);border:1px solid var(--border);
  padding:18px;cursor:pointer;transition:all 0.3s;
  position:relative;overflow:hidden;
}
.dcard::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,212,255,0.03),transparent);
  transition:all 0.3s;
}
.dcard:hover{border-color:var(--cyan);box-shadow:var(--glow);}
.dcard:hover::before{background:linear-gradient(135deg,rgba(0,212,255,0.08),transparent);}
.dcard:hover .dnum{color:var(--cyan);opacity:0.15;}
.dnum{
  font-family:var(--font-display);font-size:2.5rem;font-weight:900;
  color:var(--white3);opacity:0.06;
  position:absolute;top:6px;right:14px;
}
.dcard h3{font-family:var(--font-body);font-size:0.95rem;font-weight:600;color:var(--white);letter-spacing:0;text-transform:none;margin-bottom:4px;}
.dcard p{font-size:0.78rem;color:var(--white3);line-height:1.4;margin-bottom:8px;}
.dweight{font-family:var(--font-display);font-size:0.55rem;letter-spacing:2px;color:var(--orange);text-shadow:0 0 6px var(--orange-glow);}
.pbar{width:100%;height:2px;background:rgba(0,212,255,0.08);margin-top:10px;overflow:hidden;}
.pfill{height:100%;background:var(--cyan);box-shadow:0 0 4px var(--cyan);transition:width 0.6s;}
.dmeta{font-family:var(--font-mono);font-size:0.6rem;color:var(--white3);margin-top:5px;}

/* === STUDY === */
.study-content{line-height:1.7;font-size:0.92rem;}
.study-content h4{
  font-family:var(--font-display);font-size:0.65rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--cyan);margin:22px 0 10px;
  text-shadow:0 0 8px var(--cyan-glow);
  padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
.study-content ul{margin-left:16px;margin-bottom:10px;}
.study-content li{margin-bottom:5px;font-size:0.85rem;color:var(--white2);}
.key-term{
  display:inline;
  background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);
  padding:1px 8px;font-family:var(--font-mono);font-size:0.78rem;
  color:var(--cyan);
}
.exam-tip{
  background:rgba(255,106,0,0.06);border-left:2px solid var(--orange);
  padding:10px 14px;margin:14px 0;font-size:0.8rem;color:var(--white2);
  font-family:var(--font-body);
}

/* === QUIZ === */
.qheader{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-family:var(--font-mono);font-size:0.75rem;}
.qprog{color:var(--white3);}
.qtext{font-size:1rem;margin-bottom:16px;line-height:1.6;font-weight:500;}
.qopts{display:flex;flex-direction:column;gap:8px;}
.qopt{
  background:rgba(0,212,255,0.03);border:1px solid var(--border);
  padding:12px 16px;cursor:pointer;transition:all 0.25s;
  font-size:0.9rem;text-align:left;color:var(--white);
  font-family:var(--font-body);
}
.qopt:hover:not(.dis){border-color:var(--cyan);box-shadow:inset 0 0 20px rgba(0,212,255,0.05);}
.qopt.correct{border-color:var(--green);background:rgba(0,255,136,0.06);box-shadow:0 0 10px rgba(0,255,136,0.1);}
.qopt.wrong{border-color:var(--red);background:rgba(255,34,68,0.06);box-shadow:0 0 10px rgba(255,34,68,0.1);}
.qopt.dis{cursor:default;opacity:0.5;}
.qopt.dis.correct{opacity:1;}
.explanation{background:var(--surface2);padding:14px;margin-top:14px;font-size:0.85rem;line-height:1.6;color:var(--white2);border-left:2px solid var(--cyan);}

/* === BUTTONS === */
.btn{
  font-family:var(--font-display);font-size:0.6rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  padding:10px 22px;cursor:pointer;
  border:1px solid var(--cyan);
  background:rgba(0,212,255,0.06);color:var(--cyan);
  transition:all 0.3s;
  text-shadow:0 0 6px var(--cyan-glow);
}
.btn:hover{background:var(--cyan);color:var(--bg);box-shadow:0 0 25px var(--cyan-glow),0 0 50px rgba(0,212,255,0.1);}
.btn-dim{border-color:var(--border);color:var(--white3);background:none;text-shadow:none;}
.btn-dim:hover{border-color:var(--white3);color:var(--white);background:rgba(255,255,255,0.03);box-shadow:none;}
.btn-orange{border-color:var(--orange);color:var(--orange);background:rgba(255,106,0,0.06);text-shadow:0 0 6px var(--orange-glow);}
.btn-orange:hover{background:var(--orange);color:var(--bg);box-shadow:0 0 25px var(--orange-glow);}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

/* === FLASHCARD === */
.fc-wrap{perspective:1000px;margin:20px auto;max-width:520px;}
.fc{width:100%;min-height:200px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.5s ease;}
.fc.flip{transform:rotateY(180deg);}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:28px;text-align:center;
  font-family:var(--font-display);font-size:0.9rem;font-weight:600;
  letter-spacing:1px;color:var(--cyan);
  text-shadow:0 0 10px var(--cyan-glow);
}
.fc-face::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.3;}
.fc-back{
  transform:rotateY(180deg);
  font-family:var(--font-body);font-size:0.85rem;font-weight:400;
  letter-spacing:0;color:var(--white2);text-shadow:none;
  line-height:1.6;
}
.fc-count{text-align:center;margin:10px 0;font-family:var(--font-mono);font-size:0.7rem;color:var(--white3);}
.fc-btns{display:flex;justify-content:center;gap:10px;margin-top:14px;}

/* === EXAM === */
.timer{font-family:var(--font-display);font-size:1.2rem;font-weight:800;letter-spacing:3px;color:var(--orange);text-shadow:0 0 15px var(--orange-glow);}
.results{text-align:center;}
.big-score{
  font-family:var(--font-display);font-size:5rem;font-weight:900;
  letter-spacing:4px;
  color:var(--cyan);
  text-shadow:0 0 40px var(--cyan-glow),0 0 80px rgba(0,212,255,0.15);
}
.pass-label{font-family:var(--font-display);font-size:0.8rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;}
.pass-yes{color:var(--green);text-shadow:0 0 10px rgba(0,255,136,0.4);}
.pass-no{color:var(--red);text-shadow:0 0 10px rgba(255,34,68,0.4);}

/* === RESOURCES === */
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;}
.ritem{background:var(--surface2);padding:14px;border:1px solid var(--border);transition:all 0.3s;}
.ritem:hover{border-color:var(--cyan);}
.ritem h4{font-family:var(--font-body);font-size:0.88rem;font-weight:600;margin-bottom:3px;}
.ritem p{font-size:0.75rem;color:var(--white3);line-height:1.4;}
.rtag{
  display:inline-block;font-family:var(--font-display);
  font-size:0.5rem;letter-spacing:1px;padding:2px 8px;
  border:1px solid var(--border);color:var(--white3);
  margin-top:6px;text-transform:uppercase;
}

/* === DASHBOARD === */
.dgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
.dstat{
  background:var(--surface);border:1px solid var(--border);
  padding:16px;text-align:center;position:relative;
}
.dstat::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:1px;background:var(--cyan);opacity:0.3;box-shadow:0 0 8px var(--cyan-glow);}
.dstat .n{font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--cyan);text-shadow:0 0 12px var(--cyan-glow);}
.dstat .l{font-family:var(--font-display);font-size:0.5rem;letter-spacing:2px;color:var(--white3);margin-top:4px;text-transform:uppercase;}

/* === DOMAIN SELECT === */
.dsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.dchip{
  padding:6px 14px;border:1px solid var(--border);
  cursor:pointer;font-family:var(--font-display);font-size:0.55rem;
  letter-spacing:1px;color:var(--white3);transition:all 0.3s;text-transform:uppercase;
}
.dchip:hover,.dchip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,0.05);text-shadow:0 0 6px var(--cyan-glow);}

/* === CHART === */
.bars{display:flex;align-items:end;gap:6px;height:90px;margin-top:14px;}
.bar{flex:1;min-height:2px;transition:height 0.6s;box-shadow:0 0 6px currentColor;}

/* === BACK === */
.back{background:none;border:none;color:var(--white3);cursor:pointer;font-family:var(--font-display);font-size:0.55rem;letter-spacing:2px;margin-bottom:14px;text-transform:uppercase;}
.back:hover{color:var(--cyan);}

/* === FOOTER === */
.footer{
  text-align:center;padding:30px 20px;margin-top:30px;
  font-family:var(--font-display);font-size:0.5rem;
  letter-spacing:3px;color:var(--white3);
  border-top:1px solid var(--border);
  text-transform:uppercase;
}
.footer a{color:var(--cyan);text-shadow:0 0 8px var(--cyan-glow);}

/* === RESPONSIVE === */
@media(max-width:700px){
  .topbar{flex-direction:column;gap:6px;padding:8px 12px;}
  .stats{flex-wrap:wrap;justify-content:center;gap:10px;}
  .main{padding:12px;}
  .dgrid{grid-template-columns:1fr;}
  .nav button{padding:10px 12px;font-size:0.5rem;}
}

/* === ANIM === */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeUp 0.35s ease;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.xp-pop{animation:pop 0.3s ease;}
.hidden{display:none!important;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);}
::-webkit-scrollbar-thumb:hover{background:rgba(0,212,255,0.4);}
</style>
</head>

<script>
// ==========================================
// TRON GRID BACKGROUND
// ==========================================
(function(){
  const c=document.getElementById('tron-bg'),ctx=c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);

  const lines=[];
  for(let i=0;i<6;i++) lines.push({
    x:Math.random()*2000, y:Math.random()*2000,
    vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4,
    len:80+Math.random()*200, dir:Math.random()>0.5?0:1
  });

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);

    // Grid
    ctx.strokeStyle='rgba(0,212,255,0.025)';
    ctx.lineWidth=1;
    const spacing=80;
    for(let x=0;x<c.width;x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke();}
    for(let y=0;y<c.height;y+=spacing){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}

    // Moving light trails
    lines.forEach(l=>{
      const grad=l.dir===0?
        ctx.createLinearGradient(l.x,l.y,l.x+l.len,l.y):
        ctx.createLinearGradient(l.x,l.y,l.x,l.y+l.len);
      grad.addColorStop(0,'rgba(0,212,255,0)');
      grad.addColorStop(0.5,'rgba(0,212,255,0.12)');
      grad.addColorStop(1,'rgba(0,212,255,0)');
      ctx.strokeStyle=grad;
      ctx.lineWidth=1;
      ctx.beginPath();
      if(l.dir===0){ctx.moveTo(l.x,l.y);ctx.lineTo(l.x+l.len,l.y);}
      else{ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+l.len);}
      ctx.stroke();

      l.x+=l.vx;l.y+=l.vy;
      if(l.x>c.width+200||l.x<-200)l.vx*=-1;
      if(l.y>c.height+200||l.y<-200)l.vy*=-1;
    });

    // Center glow
    const rg=ctx.createRadialGradient(c.width/2,0,0,c.width/2,0,c.width*0.6);
    rg.addColorStop(0,'rgba(0,212,255,0.04)');
    rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.fillRect(0,0,c.width,c.height);

    requestAnimationFrame(draw);
  }
  draw();
})();

// ==========================================
// DOMAINS
// ==========================================
const DOMAINS=[
{id:1,name:"Security & Risk Management",weight:"15%",desc:"Governance, compliance, legal, risk, BCP, ethics.",
study:`
<h4>Core Concepts</h4>
<ul>
<li><span class="key-term">CIA Triad</span> — Confidentiality, Integrity, Availability. Every control maps here.</li>
<li><span class="key-term">DAD Triad</span> — Disclosure, Alteration, Destruction. The threats to CIA.</li>
<li><span class="key-term">Due Care</span> — Doing what a reasonable person would. Implementing controls.</li>
<li><span class="key-term">Due Diligence</span> — Researching risks before acting.</li>
</ul>
<div class="exam-tip">Due Care = doing. Due Diligence = researching. Shows up constantly.</div>
<h4>Policy Hierarchy</h4>
<ul>
<li><span class="key-term">Policies</span> — Mandatory. High-level. "We SHALL encrypt PII."</li>
<li><span class="key-term">Standards</span> — Mandatory. Specific. "We use AES-256."</li>
<li><span class="key-term">Baselines</span> — Mandatory. Minimum config.</li>
<li><span class="key-term">Guidelines</span> — NOT mandatory. Recommendations.</li>
<li><span class="key-term">Procedures</span> — Step-by-step instructions.</li>
</ul>
<div class="exam-tip">Only GUIDELINES are optional. Everything else mandatory.</div>
<h4>Risk Management</h4>
<ul>
<li><span class="key-term">Risk = Threat × Vulnerability × Impact</span></li>
<li><span class="key-term">Quantitative</span> — Numbers. SLE = AV × EF. ALE = SLE × ARO.</li>
<li><span class="key-term">Qualitative</span> — Categories. Delphi technique = anonymous experts.</li>
<li><span class="key-term">Risk Responses</span>: Mitigate, Transfer (insurance), Avoid, Accept</li>
</ul>
<div class="exam-tip">ALE = SLE × ARO. If safeguard cost > ALE, don't do it.</div>
<h4>Legal & Regulatory</h4>
<ul>
<li><span class="key-term">GDPR</span> — EU. 72-hour breach notification. 4% revenue fines.</li>
<li><span class="key-term">HIPAA</span> — US healthcare. PHI protection.</li>
<li><span class="key-term">SOX</span> — Financial reporting. <span class="key-term">GLBA</span> — Financial data.</li>
<li><span class="key-term">Criminal</span> — Beyond reasonable doubt. <span class="key-term">Civil</span> — Preponderance of evidence.</li>
</ul>
<h4>BCP & DRP</h4>
<ul>
<li><span class="key-term">BIA</span> — Identifies critical functions + MTD, RTO, RPO.</li>
<li><span class="key-term">RPO ≤ RTO ≤ MTD</span> — Always. RPO=data, RTO=systems, MTD=business.</li>
</ul>
<h4>Ethics</h4>
<ul><li>(ISC)² Code: Protect society > Act honorably > Diligent service > Advance profession.</li></ul>
<div class="exam-tip">"Protect society" is ALWAYS #1. Company vs public safety? Public wins.</div>
`},
{id:2,name:"Asset Security",weight:"10%",desc:"Classification, ownership, privacy, retention, destruction.",
study:`
<h4>Data Classification</h4>
<ul>
<li><span class="key-term">Government</span>: Top Secret > Secret > Confidential > Unclassified</li>
<li><span class="key-term">Commercial</span>: Confidential > Private > Sensitive > Public</li>
</ul>
<h4>Data Roles</h4>
<ul>
<li><span class="key-term">Data Owner</span> — Management. Classifies data.</li>
<li><span class="key-term">Data Custodian</span> — IT. Implements protections.</li>
<li><span class="key-term">Data Controller</span> — GDPR: decides WHY/HOW data is processed.</li>
<li><span class="key-term">Data Processor</span> — GDPR: processes on controller's behalf.</li>
</ul>
<div class="exam-tip">Owner = MANAGEMENT (not IT). Custodian = IT. "Who classifies?" = owner.</div>
<h4>Data States</h4>
<ul>
<li><span class="key-term">At Rest</span> — AES. <span class="key-term">In Transit</span> — TLS/VPN. <span class="key-term">In Use</span> — Hardest to protect.</li>
</ul>
<h4>Sanitization</h4>
<ul>
<li><span class="key-term">Clearing</span> → <span class="key-term">Purging</span> → <span class="key-term">Destruction</span></li>
<li>SSDs → crypto-erase (magnets don't work on flash). HDDs → degaussing works.</li>
</ul>
<h4>Privacy</h4>
<ul>
<li><span class="key-term">Data Minimization</span> — Collect only what you need.</li>
<li><span class="key-term">Pseudonymization</span> — Reversible. <span class="key-term">Anonymization</span> — Irreversible.</li>
</ul>
`},
{id:3,name:"Security Architecture & Engineering",weight:"13%",desc:"Models, crypto, physical security — math meets metal.",
study:`
<h4>Security Models</h4>
<ul>
<li><span class="key-term">Bell-LaPadula</span> — CONFIDENTIALITY. "No read up, no write down."</li>
<li><span class="key-term">Biba</span> — INTEGRITY. "No read down, no write up."</li>
<li><span class="key-term">Clark-Wilson</span> — INTEGRITY via well-formed transactions.</li>
<li><span class="key-term">Brewer-Nash</span> — Chinese Wall. Conflicts of interest.</li>
</ul>
<div class="exam-tip">BLP = "Bell Lips sealed" (confidentiality). Biba = "Bible = truth" (integrity).</div>
<h4>Cryptography</h4>
<ul>
<li><span class="key-term">Symmetric</span> — Same key. Fast. AES, DES, 3DES. Problem: key distribution.</li>
<li><span class="key-term">Asymmetric</span> — Key pair. Slow. RSA, ECC, DH. Solves distribution.</li>
<li><span class="key-term">Hashing</span> — One-way. SHA-256/SHA-3 (good). MD5/SHA-1 (broken).</li>
<li><span class="key-term">Digital Signatures</span> — Hash + encrypt with PRIVATE key = integrity + auth + non-repudiation.</li>
<li><span class="key-term">AES</span> — 128/192/256-bit. Gold standard. ECB mode = bad.</li>
</ul>
<div class="exam-tip">TLS = hybrid. Asymmetric swaps keys, symmetric encrypts data.</div>
<h4>PKI</h4>
<ul>
<li><span class="key-term">CA</span> issues certs. <span class="key-term">RA</span> verifies identity. <span class="key-term">OCSP</span> > CRL for real-time checks.</li>
</ul>
<h4>Design Principles</h4>
<ul>
<li><span class="key-term">Defense in Depth</span> — Layers. <span class="key-term">Least Privilege</span> — Minimum access.</li>
<li><span class="key-term">Fail Secure</span> — Locks on failure. <span class="key-term">Zero Trust</span> — Verify everything.</li>
</ul>
<h4>Physical</h4>
<ul><li>FM-200 for data centers. Halon banned. HVAC: positive pressure, 64-75°F.</li></ul>
`},
{id:4,name:"Communication & Network Security",weight:"13%",desc:"OSI, protocols, firewalls, attacks — the pipes.",
study:`
<h4>OSI Model</h4>
<ul>
<li><span class="key-term">7 Application</span> HTTP, FTP, DNS — <span class="key-term">6 Presentation</span> Encryption — <span class="key-term">5 Session</span></li>
<li><span class="key-term">4 Transport</span> TCP/UDP — <span class="key-term">3 Network</span> IP, Routers — <span class="key-term">2 Data Link</span> MAC, Switches — <span class="key-term">1 Physical</span></li>
</ul>
<div class="exam-tip">"Please Do Not Throw Sausage Pizza Away" (1→7).</div>
<h4>Key Protocols & Ports</h4>
<ul>
<li><span class="key-term">Ports</span>: FTP(21) SSH(22) SMTP(25) DNS(53) HTTP(80) HTTPS(443) LDAP(389) RDP(3389)</li>
<li><span class="key-term">TCP 3-Way</span>: SYN → SYN-ACK → ACK</li>
<li><span class="key-term">IPSec</span>: AH (integrity only) vs ESP (encrypt + integrity). Tunnel vs Transport mode.</li>
<li><span class="key-term">TLS</span> 1.2+ required. 1.3 best. SSH replaced Telnet.</li>
</ul>
<h4>Devices</h4>
<ul>
<li><span class="key-term">Firewall</span>: Packet filter(L3), Stateful(L3-4), Proxy(L7), NGFW(all)</li>
<li><span class="key-term">IDS</span> = passive, alerts. <span class="key-term">IPS</span> = active, blocks inline.</li>
</ul>
<h4>Attacks</h4>
<ul>
<li><span class="key-term">ARP Spoofing</span>(L2), <span class="key-term">DNS Poisoning</span>, <span class="key-term">DDoS</span>, <span class="key-term">MITM</span></li>
</ul>
<h4>Wireless</h4>
<ul><li>WEP(dead) → WPA → WPA2(AES) → WPA3(SAE). 802.1X for enterprise.</li></ul>
`},
{id:5,name:"Identity & Access Management",weight:"13%",desc:"Authentication, authorization, access models.",
study:`
<h4>Authentication Factors</h4>
<ul>
<li><span class="key-term">Know</span>(password) <span class="key-term">Have</span>(token) <span class="key-term">Are</span>(biometric)</li>
<li><span class="key-term">MFA</span> = 2+ DIFFERENT categories. Two passwords ≠ MFA.</li>
</ul>
<h4>Biometrics</h4>
<ul>
<li><span class="key-term">Type I / FRR</span> — Rejects legit user. Annoying.</li>
<li><span class="key-term">Type II / FAR</span> — Lets impostor in. DANGER.</li>
<li><span class="key-term">CER/EER</span> — Where FRR=FAR. Lower = better.</li>
</ul>
<div class="exam-tip">Type 2 = FAR = security risk. CER compares biometric systems.</div>
<h4>Access Control Models</h4>
<ul>
<li><span class="key-term">DAC</span> — Owner decides. ACLs. <span class="key-term">MAC</span> — System labels. Most restrictive.</li>
<li><span class="key-term">RBAC</span> — Job roles. Most common. <span class="key-term">ABAC</span> — Attributes. Most flexible.</li>
</ul>
<h4>SSO & Federation</h4>
<ul>
<li><span class="key-term">OAuth</span> = AUTHORIZATION. <span class="key-term">OIDC</span> = Auth ON TOP of OAuth.</li>
<li><span class="key-term">SAML</span> = XML, enterprise SSO. <span class="key-term">Kerberos</span> = tickets, symmetric, AD.</li>
<li><span class="key-term">LDAP</span> = port 389 (636 LDAPS).</li>
</ul>
<h4>Lifecycle</h4>
<ul><li>Provision → Review → Revoke. <span class="key-term">Privilege Creep</span> = accumulating access. Fix: periodic reviews.</li></ul>
`},
{id:6,name:"Security Assessment & Testing",weight:"12%",desc:"Pentests, audits, SIEM — finding holes first.",
study:`
<h4>Vuln Assessment vs Pentest</h4>
<ul>
<li><span class="key-term">Vuln Assessment</span> — Scan and report. No exploitation.</li>
<li><span class="key-term">Pentest</span> — Exploit vulns. Needs WRITTEN AUTHORIZATION.</li>
</ul>
<h4>Pentest Types</h4>
<ul>
<li><span class="key-term">Black Box</span> = no knowledge. <span class="key-term">White Box</span> = full knowledge. <span class="key-term">Gray</span> = partial.</li>
</ul>
<h4>Teams</h4>
<ul><li><span class="key-term">Red</span>=offense. <span class="key-term">Blue</span>=defense. <span class="key-term">Purple</span>=collab.</li></ul>
<h4>Testing</h4>
<ul>
<li><span class="key-term">SAST</span> = static code analysis. <span class="key-term">DAST</span> = test running app. <span class="key-term">Fuzzing</span> = random input.</li>
</ul>
<h4>SOC Reports</h4>
<ul>
<li><span class="key-term">SOC 1</span> financial. <span class="key-term">SOC 2</span> security (Type I=snapshot, Type II=over time). <span class="key-term">SOC 3</span> public.</li>
</ul>
<div class="exam-tip">SOC 2 Type II = gold standard. Shows controls WORK over time.</div>
<h4>SIEM</h4>
<ul><li>Collects, correlates, analyzes logs. Alerts on threats. Track MTTD, MTTR.</li></ul>
`},
{id:7,name:"Security Operations",weight:"13%",desc:"IR, forensics, DR, monitoring — when it hits the fan.",
study:`
<h4>Incident Response (ORDER MATTERS)</h4>
<ul>
<li><span class="key-term">1. Preparation</span> — Team, tools, playbooks. Before anything.</li>
<li><span class="key-term">2. Detection</span> — Spot it. SIEM, IDS, reports.</li>
<li><span class="key-term">3. Containment</span> — Stop the bleeding.</li>
<li><span class="key-term">4. Eradication</span> — Rip the threat out.</li>
<li><span class="key-term">5. Recovery</span> — Restore. Watch for recurrence.</li>
<li><span class="key-term">6. Lessons Learned</span> — Post-mortem. NOT optional.</li>
</ul>
<div class="exam-tip">Never skip containment. Lessons Learned is required. Order is heavily tested.</div>
<h4>Forensics</h4>
<ul>
<li><span class="key-term">Volatility Order</span>: CPU Regs → Cache → RAM → Swap → Disk → Removable</li>
<li><span class="key-term">Chain of Custody</span> — Document every hand. Break = inadmissible.</li>
<li>Image first. Hash verify. NEVER touch the original.</li>
</ul>
<h4>Disaster Recovery</h4>
<ul>
<li><span class="key-term">Hot</span>=hours/$$$$$. <span class="key-term">Warm</span>=days/$$$. <span class="key-term">Cold</span>=weeks/$.</li>
<li><span class="key-term">RAID</span>: 0(stripe) 1(mirror) 5(parity,3+) 6(double,4+) 10(mirror+stripe)</li>
</ul>
<h4>Backups</h4>
<ul>
<li><span class="key-term">Full</span> = slow backup, fast restore. <span class="key-term">Incremental</span> = fast backup, slow restore.</li>
<li><span class="key-term">Differential</span> = since last full. Only need full + latest diff to restore.</li>
</ul>
<h4>Tools</h4>
<ul><li><span class="key-term">SOAR</span> automation. <span class="key-term">EDR</span> endpoints. <span class="key-term">XDR</span> cross-platform. <span class="key-term">Honeypot</span> decoy.</li></ul>
`},
{id:8,name:"Software Development Security",weight:"11%",desc:"SDLC, OWASP, secure code, DevSecOps.",
study:`
<h4>SDLC Models</h4>
<ul>
<li><span class="key-term">Waterfall</span> = linear. <span class="key-term">Agile</span> = sprints. <span class="key-term">DevSecOps</span> = security in pipeline.</li>
</ul>
<div class="exam-tip">"Shift left" = security EARLIER. 10-100x cheaper to fix in dev vs prod.</div>
<h4>OWASP Top Hits</h4>
<ul>
<li><span class="key-term">Injection</span>(SQLi, XSS) → parameterized queries</li>
<li><span class="key-term">Broken Auth/Access Control</span> → MFA, deny by default</li>
<li><span class="key-term">XSS</span> → output encoding. <span class="key-term">CSRF</span> → anti-CSRF tokens. <span class="key-term">SSRF</span> → input validation.</li>
</ul>
<h4>Secure Coding</h4>
<ul>
<li><span class="key-term">Whitelist > Blacklist</span> for input validation. Always server-side.</li>
<li><span class="key-term">Parameterized Queries</span> — Kill SQLi. Never concatenate user input.</li>
</ul>
<h4>Database</h4>
<ul>
<li><span class="key-term">Aggregation</span> = combining non-sensitive → sensitive. <span class="key-term">Inference</span> = deducing from clues.</li>
<li><span class="key-term">Polyinstantiation</span> = multiple rows, same key, diff classifications.</li>
</ul>
<h4>Testing</h4>
<ul><li>Unit → Integration → System → Acceptance → <span class="key-term">Regression</span> (did new code break old?)</li></ul>
`}
];

function startEx(n){
  let p=[...QUESTIONS];for(let i=p.length-1;i>0;i--){const j=0|Math.random()*(i+1);[p[i],p[j]]=[p[j],p[i]];}

function ansE(i){
  if(ex.ans)return;ex.ans=true;
  const q=ex.qs[ex.i],ok=i===q.a;if(ok)ex.sc++;
  state.totalAns++;if(ok)state.totalCorr++;const s=ds(q.d);s.a++;if(ok)s.c++;streak();xp(ok?15:5);
  document.querySelectorAll('.qopt').forEach((b,j)=>{b.classList.add('dis');if(j===q.a)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong');});
  document.getElementById('eexp').classList.remove('hidden');
  document.getElementById('eexp').innerHTML=`<div class="explanation"><strong>${ok?'✓':'✗'}</strong> ${q.e}</div>`;
  document.getElementById('enxt').classList.remove('hidden');
}
function renderER(a){
  clearInterval(exT);
  const pct=Math.round(ex.sc/ex.qs.length*100);
  state.exams.push(pct);xp(pct>=70?100:40);save();ex.on=false;
  a.innerHTML=`<div class="fadein"><div class="card results">
    <div class="big-score">${pct}%</div>
    <div class="pass-label ${pct>=70?'pass-yes':'pass-no'}">${pct>=70?'Pass':'Fail'}</div>
    <p style="color:var(--white2);margin:10px 0;font-family:var(--font-mono)">${ex.sc}/${ex.qs.length} // ${(Date.now()-ex.st)/60000|0}min</p>
    <div class="btns" style="justify-content:center">
      <button class="btn" onclick="ex=null;render()">Back</button>
      <button class="btn btn-dim" onclick="tab='dashboard';ex=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelector('[data-tab=dashboard]').classList.add('active');render()">Dashboard</button>
    </div>
  </div></div>`;
}
